[workspace]
members = [
    "crates/plexmaton-cli",
    "crates/plexmaton-core",
    "crates/plexmaton-sim",
    "crates/plexmaton-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The TUI owns the terminal screen. Stray printing corrupts the frame it is drawing.
print_stdout = "deny"
print_stderr = "deny"
# Terminal, storage, provider, and external-process results must not be unwrapped.
unwrap_used = "deny"
# Sprawl guards; thresholds live in clippy.toml.
too_many_lines = "deny"
cognitive_complexity = "deny"
