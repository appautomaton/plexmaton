[workspace]
members = [
    "crates/plexmaton-agent",
    "crates/plexmaton-cli",
    "crates/plexmaton-command",
    "crates/plexmaton-core",
    "crates/plexmaton-file-tools",
    "crates/plexmaton-math",
    "crates/plexmaton-provider",
    "crates/plexmaton-runtime",
    "crates/plexmaton-session-store",
    "crates/plexmaton-skills",
    "crates/plexmaton-sim",
    "crates/plexmaton-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
# `osc52` is the clipboard path, and the only one that survives SSH and tmux. It arrives with the
# adapter that uses it (`plexmaton-cli::clipboard`), never in advance.
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
eventsource-stream2 = { version = "0.4.0", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
ratex-parser = { version = "=0.1.14", default-features = false }
ratex-layout = { version = "=0.1.14", default-features = false }
ratex-types = { version = "=0.1.14", default-features = false }
ratex-font = { version = "=0.1.14", default-features = false }
# Defaults off: `fork` and `timeout` isolate a failing case in a subprocess, which these properties
# do not need, and they pull `rusty-fork` and `tempfile` into a workspace that has neither.
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
# `unstable-rendered-line-info` gives `Paragraph::line_count`, which is how a viewport learns how
# tall its content is. It is ratatui measuring its own wrapping with the same `WordWrapper` the
# renderer uses, so the measurement and the paint cannot disagree. Exact pin plus a committed
# lockfile means an unstable API change surfaces at a reviewed bump, never silently.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
unicode-width = "0.2.2"
yaml_serde = { version = "0.10.7", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1.26.0", default-features = false, features = ["std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The TUI owns the terminal screen. Stray printing corrupts the frame it is drawing.
print_stdout = "deny"
print_stderr = "deny"
# Terminal, storage, provider, and external-process results must not be unwrapped.
unwrap_used = "deny"
# Sprawl guards; thresholds live in clippy.toml.
too_many_lines = "deny"
cognitive_complexity = "deny"
