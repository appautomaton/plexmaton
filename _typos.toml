# Proper nouns the dictionary does not know. Mapping a word to itself declares it correct.
# Keep this list to genuine names; suppressing a real misspelling here hides it everywhere.

[default.extend-words]
Ratatui = "Ratatui"
ratatui = "ratatui"
# Conversation tree invariant prefix and matching test names.
TRE = "TRE"
tre = "tre"

[default.extend-identifiers]
# Pinned upstream math AST field; not first-party prose.
numer = "numer"

[files]
# Generated or vendored content is not ours to correct.
extend-exclude = ["Cargo.lock", "target/", ".references/"]
