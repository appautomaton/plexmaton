[package]
name = "plexmaton-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "plexmaton"
path = "src/main.rs"

# The measurement harness. A second binary rather than a subcommand: it owns no terminal, and the
# interactive binary must not grow argument parsing to reach a lane that never draws to a screen.
[[bin]]
name = "plexmaton-measure"
path = "src/measure/main.rs"

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
futures-util.workspace = true
plexmaton-agent = { path = "../plexmaton-agent" }
plexmaton-core = { path = "../plexmaton-core" }
plexmaton-file-tools = { path = "../plexmaton-file-tools" }
plexmaton-provider = { path = "../plexmaton-provider" }
plexmaton-runtime = { path = "../plexmaton-runtime" }
plexmaton-sim = { path = "../plexmaton-sim" }
plexmaton-tui = { path = "../plexmaton-tui" }
ratatui.workspace = true
tokio.workspace = true

# The executable translates addressed user actions into the loop's typed `Input` now. Its
# live runtime drives `Agent::handle`; the simulator remains the measurement and test producer.

[lints]
workspace = true
