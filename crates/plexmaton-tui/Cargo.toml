[package]
name = "plexmaton-tui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plexmaton-core = { path = "../plexmaton-core" }
ratatui.workspace = true
thiserror.workspace = true
# The composer edits and measures what the user sees, not what the bytes say: `Backspace` removes
# one grapheme cluster, and the cursor sits at the display width of the line rather than its length.
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
plexmaton-sim = { path = "../plexmaton-sim" }
# Selection is a range over content, and the claim is that nothing about the *presentation* changes
# what it copies. Enumerating widths and endpoints by hand proves it for the cases someone thought
# of; generating them is what proves it for the ones they did not.
proptest.workspace = true

[lints]
workspace = true

