<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 540 600" preserveAspectRatio="xMinYMin meet"><rect width="100%" height="100%" fill="#11131c"/><g font-family="Menlo,'Agave Nerd Font Mono',monospace" font-size="14"><text x="9" y="255" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs">[?] </text><text x="45" y="255" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="108" lengthAdjust="spacingAndGlyphs">exec_command</text><text x="153" y="255" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="180" lengthAdjust="spacingAndGlyphs"> · approval required</text><text x="459" y="275" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs"> (</text><text x="477" y="275" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs"> !1 </text><text x="513" y="275" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">) </text><text x="0" y="295" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">── </text><text x="27" y="295" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="153" lengthAdjust="spacingAndGlyphs">Approval required</text><text x="180" y="295" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="135" lengthAdjust="spacingAndGlyphs"> · exec_command</text><text x="315" y="295" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="225" lengthAdjust="spacingAndGlyphs"> ────────────────────────</text><text x="27" y="335" fill="#f5d072" font-weight="normal" font-style="normal" opacity="1" text-decoration="underline" xml:space="preserve" textLength="486" lengthAdjust="spacingAndGlyphs">Command "set -o pipefail\npayload='{\"model\":\"examp…</text><text x="27" y="355" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="378" lengthAdjust="spacingAndGlyphs">No current permission allows this command.</text><rect x="27" y="380" width="486" height="20" fill="#1c2233"/><text x="27" y="395" fill="#f5d072" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="486" lengthAdjust="spacingAndGlyphs">&gt; 1. Allow once                                       </text><text x="45" y="415" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="198" lengthAdjust="spacingAndGlyphs">2. Allow and remember…</text><text x="45" y="435" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="63" lengthAdjust="spacingAndGlyphs">3. Deny</text><text x="27" y="475" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="342" lengthAdjust="spacingAndGlyphs">1–3 decide · ↑↓ Enter · Ctrl-O details</text><text x="27" y="495" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="324" lengthAdjust="spacingAndGlyphs">Esc input · Tab returns to this card</text><text x="0" y="535" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">── </text><text x="27" y="535" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="153" lengthAdjust="spacingAndGlyphs">Message Plexmaton</text><text x="180" y="535" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="360" lengthAdjust="spacingAndGlyphs"> ───────────────────────────────────────</text><text x="9" y="555" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="243" lengthAdjust="spacingAndGlyphs">Type a message · ⇥ to focus</text><text x="0" y="575" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="540" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────</text></g></svg>