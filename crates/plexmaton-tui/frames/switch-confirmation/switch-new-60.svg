<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 540 600" preserveAspectRatio="xMinYMin meet"><rect width="100%" height="100%" fill="#11131c"/><g font-family="Menlo,'Agave Nerd Font Mono',monospace" font-size="14"><text x="432" y="15" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="63" lengthAdjust="spacingAndGlyphs"> Agents</text><text x="495" y="15" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs"> ^B </text><text x="9" y="35" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="468" lengthAdjust="spacingAndGlyphs">Agent is active; no transcript item has started yet.</text><text x="0" y="455" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">── </text><text x="27" y="455" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="72" lengthAdjust="spacingAndGlyphs">Commands</text><text x="99" y="455" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="441" lengthAdjust="spacingAndGlyphs"> ────────────────────────────────────────────────</text><rect x="9" y="460" width="522" height="20" fill="#1c2233"/><text x="9" y="475" fill="#f5d072" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="522" lengthAdjust="spacingAndGlyphs">&gt; /new  Start a new conversation                          </text><text x="9" y="495" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="468" lengthAdjust="spacingAndGlyphs"> ↑↓ choose · Tab complete · Enter accept · Esc close</text><text x="0" y="515" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">── </text><text x="27" y="515" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="153" lengthAdjust="spacingAndGlyphs">Message Plexmaton</text><text x="180" y="515" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="360" lengthAdjust="spacingAndGlyphs"> ───────────────────────────────────────</text><text x="9" y="535" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs">/new</text><text x="0" y="555" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="540" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────</text><text x="9" y="575" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="522" lengthAdjust="spacingAndGlyphs">Delegated 1 is still working. Choose again to switch — it </text><text x="9" y="595" fill="#ffc466" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="261" lengthAdjust="spacingAndGlyphs">stops, and its work is saved.</text></g></svg>