<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1080 800" preserveAspectRatio="xMinYMin meet"><rect width="100%" height="100%" fill="#11131c"/><g font-family="Menlo,'Agave Nerd Font Mono',monospace" font-size="14"><text x="9" y="35" fill="#f5d072" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="9" lengthAdjust="spacingAndGlyphs">▌</text><text x="18" y="35" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="738" lengthAdjust="spacingAndGlyphs">Show me a softer Markdown style — blue, green, and the rest of our pastel palette.</text><text x="9" y="75" fill="#82b4f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="207" lengthAdjust="spacingAndGlyphs">A calmer place to think</text><text x="9" y="115" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="180" lengthAdjust="spacingAndGlyphs">A clear answer with </text><text x="189" y="115" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="135" lengthAdjust="spacingAndGlyphs">useful emphasis</text><text x="324" y="115" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">, </text><text x="342" y="115" fill="#e6e9f0" font-weight="normal" font-style="italic" opacity="1" text-decoration="none" xml:space="preserve" textLength="135" lengthAdjust="spacingAndGlyphs">a little nuance</text><text x="477" y="115" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="369" lengthAdjust="spacingAndGlyphs">, and colors that help you find your way.</text><text x="9" y="155" fill="#8cdaa5" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="297" lengthAdjust="spacingAndGlyphs">Keep the important things visible</text><text x="9" y="195" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">• </text><text x="27" y="195" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="126" lengthAdjust="spacingAndGlyphs">Blue and green</text><text x="153" y="195" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="180" lengthAdjust="spacingAndGlyphs"> lead the hierarchy.</text><text x="9" y="215" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">• </text><text x="27" y="215" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs">Run </text><text x="63" y="215" fill="#f5d072" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="90" lengthAdjust="spacingAndGlyphs">cargo test</text><text x="153" y="215" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="171" lengthAdjust="spacingAndGlyphs"> before continuing.</text><text x="9" y="235" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">• </text><text x="27" y="235" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="387" lengthAdjust="spacingAndGlyphs">Keep 中文 and é intact when selecting text.</text><text x="9" y="275" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">│ </text><text x="27" y="275" fill="#8ea2c4" font-weight="normal" font-style="italic" opacity="1" text-decoration="none" xml:space="preserve" textLength="504" lengthAdjust="spacingAndGlyphs">Soft colors should support reading, not compete with it.</text><text x="9" y="315" fill="#78d2cd" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="189" lengthAdjust="spacingAndGlyphs">Small, explicit steps</text><text x="9" y="355" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="54" lengthAdjust="spacingAndGlyphs">┌ rust</text><text x="9" y="375" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">│ </text><text x="27" y="375" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="99" lengthAdjust="spacingAndGlyphs">fn main() {</text><text x="9" y="395" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">│ </text><text x="27" y="395" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="288" lengthAdjust="spacingAndGlyphs">    let message = "hello, 世界";</text><text x="9" y="415" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">│ </text><text x="27" y="415" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="234" lengthAdjust="spacingAndGlyphs">    println!("{message}");</text><text x="9" y="435" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="18" lengthAdjust="spacingAndGlyphs">│ </text><text x="27" y="435" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="9" lengthAdjust="spacingAndGlyphs">}</text><text x="9" y="455" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="9" lengthAdjust="spacingAndGlyphs">└</text><text x="9" y="495" fill="#8cdaa5" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="180" lengthAdjust="spacingAndGlyphs">Check the essentials</text><text x="9" y="535" fill="#82b4f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="36" lengthAdjust="spacingAndGlyphs">Area</text><text x="162" y="535" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text><text x="189" y="535" fill="#82b4f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="54" lengthAdjust="spacingAndGlyphs">Result</text><text x="9" y="555" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="279" lengthAdjust="spacingAndGlyphs">──────────────────┼────────────</text><text x="9" y="575" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="90" lengthAdjust="spacingAndGlyphs">Exact copy</text><text x="162" y="575" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text><text x="189" y="575" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="81" lengthAdjust="spacingAndGlyphs">Preserved</text><text x="9" y="595" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="99" lengthAdjust="spacingAndGlyphs">Status line</text><text x="162" y="595" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text><text x="189" y="595" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="81" lengthAdjust="spacingAndGlyphs">Unchanged</text><text x="9" y="615" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="153" lengthAdjust="spacingAndGlyphs">Main conversation</text><text x="162" y="615" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text><text x="189" y="615" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="99" lengthAdjust="spacingAndGlyphs">Always here</text><text x="9" y="655" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="81" lengthAdjust="spacingAndGlyphs">Read the </text><text x="90" y="655" fill="#82b4f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="underline" xml:space="preserve" textLength="108" lengthAdjust="spacingAndGlyphs">design notes</text><text x="198" y="655" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="252" lengthAdjust="spacingAndGlyphs"> (https://example.com/notes)</text><text x="450" y="655" fill="#e6e9f0" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="180" lengthAdjust="spacingAndGlyphs"> when you are ready.</text><text x="0" y="715" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">── </text><text x="27" y="715" fill="#e6e9f0" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="153" lengthAdjust="spacingAndGlyphs">Message Plexmaton</text><text x="180" y="715" fill="#f5d072" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="63" lengthAdjust="spacingAndGlyphs"> · high</text><text x="243" y="715" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="837" lengthAdjust="spacingAndGlyphs"> ────────────────────────────────────────────────────────────────────────────────────────────</text><text x="9" y="735" fill="#8ea2c4" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="243" lengthAdjust="spacingAndGlyphs">Type a message · ⇥ to focus</text><text x="0" y="755" fill="#3d4664" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="1080" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><rect x="0" y="760" width="135" height="20" fill="#b496eb"/><text x="0" y="775" fill="#2d2840" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="135" lengthAdjust="spacingAndGlyphs">  Luna  high </text><rect x="135" y="760" width="9" height="20" fill="#c8e078"/><polygon points="135,760 144,770 135,780" fill="#b496eb"/><rect x="144" y="760" width="171" height="20" fill="