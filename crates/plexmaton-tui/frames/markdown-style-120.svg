="795" fill="#ffc466" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs">dev</text><text x="153" y="795" fill="#8c8296" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> / </text><text x="180" y="795" fill="#c8e078" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="54" lengthAdjust="spacingAndGlyphs">agents</text><text x="234" y="795" fill="#8c8296" font-weight="normal" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="27" lengthAdjust="spacingAndGlyphs"> / </text><text x="261" y="795" fill="#8cdaa5" font-weight="bold" font-style="normal" opacity="1" text-decoration="none" xml:space="preserve" textLength="81" lengthAdjust="spacingAndGlyphs">plexmaton</text></g></svg>