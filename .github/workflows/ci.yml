name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test prerequisites
        run: brew install bash ripgrep jq
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deny,cargo-machete,typos-cli
      - run: cargo fmt --all --check
      - run: python3 -m unittest discover -s scripts/tests
      - run: ./scripts/check-file-length.sh
      - run: ./scripts/check-crate-graph.sh
      - run: ./scripts/check-citations.sh
      - run: ./scripts/check-doc-budget.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny check
      - run: cargo machete
      - run: typos
      - run: python3 scripts/smoke-tui.py
      - run: python3 scripts/smoke-statusline.py
      - run: python3 scripts/smoke-permissions.py
